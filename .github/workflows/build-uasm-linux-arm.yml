name: Build and Release UASM on Linux ARM64

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release 版本号（例如 v1.0.0），留空则不发布'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64

    steps:
      - name: Install Packages
        run: |
          yum install -y tar wget

      - name: Download UASM source & extract
        run: |
          wget https://github.com/Terraspace/UASM/archive/refs/tags/v2.57r.tar.gz
          tar -xzf v2.57r.tar.gz

      - name: Run build
        run: |
          cd UASM-2.57r
          make -f Makefile-Linux-GCC-64.mak
          cp GccUnixR/uasm ../uasm

      - name: Verify targets
        run: |
          file uasm
          ldd uasm || echo "Static binary or no dynamic dependencies"

      - name: Collect targets
        run: |
          tar -czvf uasm-2.57r-linux-arm64.tar.gz uasm

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: uasm-linux-arm64
          path: uasm-2.57r-linux-arm64.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: build
    # 授予写入权限，允许创建 Release
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != ''
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded files
        run: ls -la ./artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version }}
          name: Release ${{ github.event.inputs.release_version }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}