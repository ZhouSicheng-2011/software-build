name: Build bit7z on Linux ARM64 and MacOS x64

on:
    workflow_dispatch:
        inputs:
            bit7z_version:
                description: "bit7z版本 (如4.0.12) "
                required: true
                type: string

jobs:
    build-for-manylinux_2_28-arm64:
        runs-on: ubuntu-24.04-arm
        container:
            image: quay.io/pypa/manylinux_2_28_aarch64
        steps:
            - name: Install packages
              run: yum install -y tar wget

            - name: Download 7zip-zstd source code & extract & build 7-zip shared library
              run: |
                mkdir 7zip-build
                mkdir 7zip
                cd 7zip-build
                wget https://github.com/mcmilk/7-Zip-zstd/archive/refs/tags/v26.01-v1.5.7-R1.tar.gz
                tar -xzf v26.01-v1.5.7-R1.tar.gz
                cd 7-Zip-zstd-26.01-v1.5.7-R1/CPP/7zip/Bundles/Format7zF
                make -f makefile.gcc -j1 USE_ASM=1 IS_ARM64=1 PLATFORM=arm64
                cd ../../../../../..
                cp 7zip-build/7-Zip-zstd-26.01-v1.5.7-R1/CPP/7zip/Bundles/Format7zF/_o/7z.so 7zip/7z.so
                cp 7zip-build/v26.01-v1.5.7-R1.tar.gz v26.01-v1.5.7-R1.tar.gz
                rm -rf 7zip-build

            - name: Download bit7z source code & extract
              run: |
                wget "https://github.com/rikyoz/bit7z/archive/refs/tags/v${{ github.event.inputs.bit7z_version }}.tar.gz"
                tar -xzf v${{ github.event.inputs.bit7z_version }}.tar.gz
            
            - name: Prepare build environment & Run CMake configuration & Run make to compile
              run: |
                cd bit7z-${{ github.event.inputs.bit7z_version }}
                mkdir build
                cd build
                tar -xzf ../../v26.01-v1.5.7-R1.tar.gz
                SEVENZIP=$(readlink -f 7-Zip-zstd-26.01-v1.5.7-R1)
                cmake -S .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DBIT7Z_AUTO_FORMAT=ON -DBIT7Z_REGEX_MATCHING=ON -DBIT7Z_CUSTOM_7ZIP_PATH="$SEVENZIP" -DCMAKE_POSITION_INDEPENDENT_CODE=ON -B .
                echo cmake -S .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DBIT7Z_AUTO_FORMAT=ON -DBIT7Z_REGEX_MATCHING=ON -DBIT7Z_CUSTOM_7ZIP_PATH="$SEVENZIP" -DCMAKE_POSITION_INDEPENDENT_CODE=ON -B . > ../cmake-opts.txt
                cmake --build . -j 1 --config Release
            
            - name: Collect all targets
              run: |
                tar -czvf bit7z-${{ github.event.inputs.bit7z_version }}-linux-gcc-arm64.tar.gz \
                bit7z-${{ github.event.inputs.bit7z_version }}/include \
                bit7z-${{ github.event.inputs.bit7z_version }}/lib \
                bit7z-${{ github.event.inputs.bit7z_version }}/cmake-opts.txt \
                7zip

            - name: Upload Artifact (tar.gz)
              uses: actions/upload-artifact@v4
              with:
                name: bit7z-${{ github.event.inputs.bit7z_version }}-linux-gcc-arm64
                path: bit7z-${{ github.event.inputs.bit7z_version }}-linux-gcc-arm64.tar.gz


    build-for-macos-x64:
        runs-on: macos-15-intel
        steps:
            - name: Install packages (YASM for optimizations)
              run: brew install yasm

            - name: Download 7zip-zstd source code & extract & build 7-zip shared library
              run: |
                mkdir 7zip-build
                mkdir 7zip
                cd 7zip-build
                curl -L -o v26.01-v1.5.7-R1.tar.gz https://github.com/mcmilk/7-Zip-zstd/archive/refs/tags/v26.01-v1.5.7-R1.tar.gz
                tar -xzf v26.01-v1.5.7-R1.tar.gz
                cd 7-Zip-zstd-26.01-v1.5.7-R1/CPP/7zip/Bundles/Format7zF
                export SDKROOT=`xcrun --sdk macosx --show-sdk-path`
                export MACOSX_DEPLOYMENT_TARGET=10.15
                make -f makefile.gcc -j1 USE_ASM=1 ASM=yasm USE_CLANG=1 CC=clang CXX=clang++
                cd ../../../../../..
                cp 7zip-build/7-Zip-zstd-26.01-v1.5.7-R1/CPP/7zip/Bundles/Format7zF/_o/7z.so 7zip/7z.dylib
                cp 7zip-build/v26.01-v1.5.7-R1.tar.gz v26.01-v1.5.7-R1.tar.gz
                rm -rf 7zip-build
                echo "Verify architecture:"
                file 7zip/7z.so

            - name: Download bit7z source code & extract
              run: |
                curl -LO "https://github.com/rikyoz/bit7z/archive/refs/tags/v${{ github.event.inputs.bit7z_version }}.tar.gz"
                tar -xzf v${{ github.event.inputs.bit7z_version }}.tar.gz
            
            - name: Prepare build environment & Run CMake configuration & compile
              run: |
                cd bit7z-${{ github.event.inputs.bit7z_version }}
                mkdir build
                cd build
                tar -xzf ../../v26.01-v1.5.7-R1.tar.gz
                SEVENZIP=$(realpath 7-Zip-zstd-26.01-v1.5.7-R1)
                cmake -S .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DBIT7Z_AUTO_FORMAT=ON -DBIT7Z_REGEX_MATCHING=ON -DBIT7Z_CUSTOM_7ZIP_PATH="$SEVENZIP" -DCMAKE_POSITION_INDEPENDENT_CODE=ON -B .
                echo cmake -S .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DBIT7Z_AUTO_FORMAT=ON -DBIT7Z_REGEX_MATCHING=ON -DBIT7Z_CUSTOM_7ZIP_PATH="$SEVENZIP" -DCMAKE_POSITION_INDEPENDENT_CODE=ON -B . > ../cmake-opts.txt
                cmake --build . -j 1 --config Release

            - name: Run test (optional)
              run: |
                python3 -c "import os; import ctypes; p = os.path.abspath('./7zip/7z.dylib'); lib1 = ctypes.CDLL('./7zip/7z.dylib'); lib2 = ctypes.CDLL(p); print('OK!')"
              continue-on-error: true
            
            - name: Collect all targets
              run: |
                tar -czvf bit7z-${{ github.event.inputs.bit7z_version }}-macos-x64.tar.gz \
                bit7z-${{ github.event.inputs.bit7z_version }}/include \
                bit7z-${{ github.event.inputs.bit7z_version }}/lib \
                bit7z-${{ github.event.inputs.bit7z_version }}/cmake-opts.txt \
                7zip

            - name: Upload Artifact (tar.gz)
              uses: actions/upload-artifact@v4
              with:
                name: bit7z-${{ github.event.inputs.bit7z_version }}-macos-x64
                path: bit7z-${{ github.event.inputs.bit7z_version }}-macos-x64.tar.gz

    release:
      runs-on: ubuntu-latest
      needs: [build-for-manylinux_2_28-arm64, build-for-macos-x64]
      # 授予写入权限，允许创建 Release
      permissions:
        contents: write
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.bit7z_version != ''
      steps:
        - name: Download all artifacts
          uses: actions/download-artifact@v4
          with:
            path: ./artifacts

        - name: List downloaded files
          run: ls -la ./artifacts

        - name: Create GitHub Release and upload assets
          uses: softprops/action-gh-release@v2
          with:
            tag_name: bit7z-v${{ github.event.inputs.bit7z_version }}
            name: Release bit7z-v${{ github.event.inputs.bit7z_version }}
            body: |
              ## bit7z-${{ github.event.inputs.bit7z_version }}

              ### 📦Download notice:
                1. **Linux** (Uses manylinux_2_28 image, ARM64): `bit7z-${{ github.event.inputs.bit7z_version }}-linux-gcc-arm64.tar.gz`
                3. **MacOS** (Uses the latest MacOS runner, deploy target `MacOS 10.15`, x64): `bit7z-${{ github.event.inputs.bit7z_version }}-macos-x64.tar.gz`

              ### ✨Build environment:
                1. **Linux** : manylinux_2_28 (GCC 14.2.1), arm64 + ASM optimization (GAS)
                3. **MacOS**: Uses the MacOS 15 runner, deploy target `MacOS 10.15`, x64 + ASM optimization (YASM) 

              ### 🔧Contents
              - bit7z static library (`lib/x64/libbit7z.a`)
              - bit7z headers (`include/`)
              - 7-Zip shared library (`7z.so` / `7z.dylib`)
            draft: false
            prerelease: false
            files: |
              ./artifacts/**/*.tar.gz
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}